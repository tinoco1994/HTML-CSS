<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 4 criando caixas de texto e de senha</title>
</head>
<body>
    <h1>Teste de Formulário</h1>

    <form action="cadastro.php" method="POST" autocomplete="on" >
 <p>
        <label for="iusu">Usuário:</label>
        <input type="text" name="usu" id="iusu" required minlength="5" size="10" placeholder="Nome de Usuário" autocomplete="username">
        <p>
            <label for="isen">Senha:</label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="15" placeholder="Minimo 8 letras" autocomplete="current-password">
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
 </form>
   
</body>
</html>
