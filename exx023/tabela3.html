<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de Colunas</title>
    <style>
body{
    font-family: sans-serif;
}
table{
    border-collapse: collapse;
}
td{
border: 1px solid black;
width: 200px;
padding: 10px;
text-align: center;

}
    </style>
</head>
<body>
<h1>Mesclando Colunas</h1>  

<table>
 <thead>
  <tr>
<td>A</td>
<td colspan="2">B</td>


  </tr> 
  <tr>
<td>D</td>
<td>E</td>
<td rowspan="3">F</td>

  </tr>  
  <tr>


<td colspan="2">I</td>
    
  </tr>  
  <tr>


<td colspan="2">M</td>
    
  </tr>  
  
 </thead>   
</table>
    
</body>
</html>
